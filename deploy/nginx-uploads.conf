# Add this location inside the HTTPS server block, before the generic location / block.
location ^~ /uploads/ {
    alias /srv/blog/public/uploads/;
    autoindex off;
    access_log off;

    limit_except GET HEAD {
        deny all;
    }

    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
}
